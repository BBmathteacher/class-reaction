function fail(e){err.textContent=e.message||String(e)}function clear(){seatConfig=null;editingSeats=false;picked=-1;reverseSeats=false;historyOpen=false;historyData=[];historySession="";stops.forEach(f=>f());stops=[];pollStop?.();groupStop?.();pollStop=groupStop=null;watchPoll='';g=null;members=[];questions=[];answers=[];mine=myq=mya=null}function listen(r,f){return onSnapshot(r,f,fail)}function data(s){return s.exists()?s.data():null}function rows(s){return s.docs.map(d=>({id:d.id,...d.data()}))}function button(t,a,c=''){return `<button class="${c}" data-act="${a}">${t}</button>`}function seatState(approved){const old=seatConfig?.epoch===g.epoch?seatConfig:null;const columns=old?.columns||6;let slots=(old?.slots||[]).map(u=>approved.some(m=>m.id===u)?u:'');const used=new Set(slots.filter(Boolean));for(const m of [...approved].sort((a,b)=>a.number.localeCompare(b.number))){if(used.has(m.id))continue;const i=slots.indexOf('');if(i<0)slots.push(m.id);else slots[i]=m.id;used.add(m.id)}const rows=Math.max(old?.rows||5,Math.ceil(slots.length/columns));while(slots.length<rows*columns)slots.push('');return {epoch:g.epoch,columns,rows,slots}}

function poll(){if(watchPoll===g?.poll)return;pollStop?.();pollStop=null;watchPoll=g?.poll||'';answers=[];mya=null;if(watchPoll){pollStop=teacher()?listen(col('polls',watchPoll,'answers'),s=>{answers=rows(s);render()}):listen(ref('polls',watchPoll,'answers',user.uid),s=>{mya=data(s);render()})}}
function openGroup(k){clear();gid=k;if(teacher()){stops.push(listen(ref('polls','__seating'),s=>{seatConfig=data(s)?.seating||null;render()}),listen(ref(),s=>{g=data(s);poll();render()}),listen(col('members'),s=>{members=rows(s);render()}),listen(col('questions'),s=>{questions=rows(s);render()}))}else{stops.push(listen(ref('members',user.uid),s=>{mine=data(s);if(mine?.approved&&!groupStop){groupStop=listen(ref(),s=>{g=data(s);poll();render()});stops.push(listen(ref('questions',user.uid),s=>{myq=data(s);render()}))}if(!mine?.approved){groupStop?.();groupStop=null;pollStop?.();pollStop=null;watchPoll='';g=null}render()}))}render()}

async function phase(p){if(p===g.phase||p===3&&g.postDone)return;const patch={phase:p,poll:'',postDone:g.postDone||p===3};const b=writeBatch(db);if(p===1||p===3){patch.poll=id();b.set(ref('polls',patch.poll),{session:g.session,problem:g.problem,phase:p,epoch:g.epoch,date:new Date().toISOString()})}b.update(ref(),patch);await b.commit()}
const val=x=>document.getElementById(x)?.value.trim();async function act(a){const [cmd,k]=a.split(':');switch(cmd){case'seatmode':editingSeats=!editingSeats;picked=-1;render();break;case'seatflip':reverseSeats=!reverseSeats;render();break;case'seat':{const st=seatState(members.filter(m=>m.approved&&m.epoch===g.epoch)),i=Number(k);if(!editingSeats){const m=members.find(m=>m.id===st.slots[i]);if(m){const v=answers.find(a=>a.id===m.id);alert(m.number+' '+m.name+'\n'+(opts[g.phase]?.[v?.answer]||'未回答'))}break}if(picked<0){picked=i;render();break}if(picked<st.slots.length){[st.slots[picked],st.slots[i]]=[st.slots[i],st.slots[picked]];picked=-1;await setDoc(ref('polls','__seating'),{seating:st})}break}case'seatcol':case'seatrow':case'seatauto':{const approved=members.filter(m=>m.approved&&m.epoch===g.epoch),st=seatState(approved);if(cmd==='seatcol')st.columns=Math.max(2,Math.min(10,st.columns+Number(k)));if(cmd==='seatrow')st.rows=Math.max(1,Math.min(15,st.rows+Number(k)));if(cmd==='seatauto')st.slots=[...approved].sort((a,b)=>a.number.localeCompare(b.number)).map(m=>m.id);while(st.slots.length&&st.slots.at(-1)==='')st.slots.pop();st.rows=Math.max(st.rows,Math.ceil(st.slots.length/st.columns));while(st.slots.length<st.rows*st.columns)st.slots.push('');picked=-1;await setDoc(ref('polls','__seating'),{seating:st});break}case'history':{historyData=[];for(const p of (await getDocs(col('polls'))).docs){if(p.id==='__seating')continue;historyData.push({...p.data(),answers:rows(await getDocs(collection(p.ref,'answers')))})}historyData.sort((a,b)=>b.date.localeCompare(a.date));historySession=historyData[0]?.session||'';historyOpen=true;render();break}case'historyclose':historyOpen=false;render();break;case'histselect':historySession=[...new Set(historyData.map(p=>p.session))][Number(k)];render();break;case'login' :await signInWithEmailAndPassword(auth,val('email'),document.getElementById('pw').value);break;case'anon':await signInAnonymously(auth);break;case'logout':await signOut(a t epoch=params.get('epoch');if(!epoch)throw Error('新しい参加URLが必要です');await setDoc(ref('members',user.uid),{number:n,name,approved:false,epoch});localStorage.setItem('reactionGroup',gid);break}case'answer':case'help':await setDoc(ref('polls',g.poll,'answers',user.uid),{answer:cmd==='answer'?Number(k):mya.answer,help:cmd==='help'?!mya.help:false,epoch:g.epoch,session:g.session,problem:g.problem,phase:g.phase});break;case'question':await setDoc(ref('questions',user.uid),{open:!(myq?.open&&myq.session===g.session&&myq.epoch===g.epoch),epoch:g.epoch,session:g.session});break;case'csv':{const out=[['日時','授業ID','問題','段階','内部ID','回答','教えられる']];for(const p of (await getDocs(col('polls'))).docs){if(p.id==='__seating')continue;for(const a of (await getDocs(collection(p.ref,'answers'))).docs){const v=a.data();out.push([p.data().date,v.session,v.problem,phases[v.phase],a.id,opts[v.phase]?.[v.answer],v.help?'はい':'いいえ'])}}const csv=out.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='reactions.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}}}
