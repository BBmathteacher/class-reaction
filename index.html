function fail(e){err.textContent=e.message||String(e)}function clear(){rosterOpen=false;seatConfig=null;editingSeats=false;picked=-1;reverseSeats=false;historyOpen=false;historyData=[];historySession="";stops.forEach(f=>f());stops=[];pollStop?.();groupStop?.();pollStop=groupStop=null;watchPoll='';g=null;members=[];questions=[];answers=[];mine=myq=mya=null}function listen(r,f){return onSnapshot(r,f,fail)}function data(s){return s.exists()?s.data():null}function rows(s){return s.docs.map(d=>({id:d.id,...d.data()}))}function button(t,a,c=''){return `<button class="${c}" data-act="${a}">${t}</button>`}function seatState(approved){const old=seatConfig?.epoch===g.epoch?seatConfig:null;const columns=old?.columns||6;let slots=(old?.slots||[]).map(u=>approved.some(m=>m.id===u)?u:'');const used=new Set(slots.filter(Boolean));for(const m of [...approved].sort((a,b)=>a.number.localeCompare(b.number))){if(used.has(m.id))continue;const i=slots.indexOf('');if(i<0)slots.push(m.id);else slots[i]=m.id;used.add(m.id)}const rows=Math.max(old?.rows||7,Math.ceil(slots.length/columns));while(slots.length<rows*columns)slots.push('');return {epoch:g.epoch,columns,rows,slots}}

function pendingPanel(p){return `<section class="pending ${p.length?'haspending':''}">${heading('承認待ちリスト','JOIN REQUEST','＋','orange')}<b>${p.length}人</b>${p.length?` ${button('全員承認する','approveall','greenbtn')}<div class="pendinglist">${p.map(m=>`<div class="pendingrow"><b>${esc(m.number)} ${esc(m.name)}</b>${button('承認','approve:'+m.id,'greenbtn')}${button('拒否','kick:'+m.id,'danger')}</div>`).join('')}</div>`:'　承認待ちの生徒はいません'}</section>`}
function actionPanel(title,idx,list,tone){return `<div class="actionpanel ${tone}"><h3>${stamp(idx)} ${title} <strong>${list.length}人</strong></h3>${list.length?`<div class="actionlist">${list.map(m=>`<div class="person"><b>${esc(m.number)}</b><strong>${esc(m.name)}</strong></div>`).join('')}</div>`:'<small>なし</small>'}</div>`}
function historyPanel(){if(!historyOpen)return '';const sessions=[...new Set(historyData.map(p=>p.session))];const ps=historyData.filter(p=>p.session===historySession);return `<section>${heading("授業履歴","LESSON HISTORY","▤","purple")}${button('履歴を閉じる','historyclose','alt')}<div class="historytabs">${sessions.map((x,i)=>button(esc(historyData.find(p=>p.session===x).lessonTitle||new Date(historyData.find(p=>p.session===x).date).toLocaleString('ja-JP')),'histselect:'+i,x===historySession?'selected':'alt')).join('')||'履歴なし'}</div>${ps.length?`<p><small>実施日時：${esc(new Date(ps.at(-1).date).toLocaleString('ja-JP'))}</small> ${button('授業タイトル編集','histtitle','alt')}</p>`:''}${ps.map(p=>`<div class="historyrow"><b>${esc(p.problemName||'問題 '+p.problem)}　</b><img class="histphase" src="${phaseImages[p.phase]}" alt="${esc(plain(phases[p.phase]))}">　回答 ${p.answers.length}人${(opts[p.phase]||[]).map((l,i)=>(()=>{const n=p.answers.filter(a=>a.answer===i).length, pct=p.answers.length?n/p.answers.length*100:0;return `<div class="summaryrow">${sticker(p.phase,i)}<div>${esc(plain(l))}<div class="bar"><i style="width:${pct}%;background:${['#16865b','#367bce','#d69a20','#dc414d'][p.phase===3?[0,2,3][i]:i]}"></i></div></div><b>${n}人 <small>${Math.round(pct)}%</small></b></div>`})()).join('')}</div>`).join('')}</section>`}
function render(){if(!user){app.innerHTML=`<section><h2>${join?'生徒用':'教員ログイン'}</h2>${join?button('生徒として参加','anon'):`<input id="email" type="email" placeholder="メールアドレス"><input id="pw" type="password" placeholder="パスワード">${button('ログイン','login')}`}</section>`;return}if(teacher()){if(!gid){app.innerHTML=`<section><h2>担当授業集団</h2><input id="newname" placeholder="新しい集団名">${button('集団作成','create')}<div class="grid">${groups.filter(x=>x.enabled).map(x=>`<section><h3>${esc(x.name)}</h3>${button('授業画面へ進む →','open:'+x.id)}<details><summary>⚙ 集団管理</summary><div class="manage">${button('🔗 参加URLをコピー','listlink:'+x.id,'seatblue')}${button('✎ 集団名変更','listrename:'+x.id,'seatgreen')}${button('↻ 生徒一括リセット','listreset:'+x.id,'orangebtn')}${button('集団削除','listremove:'+x.id,'danger')}</div></details></section>`).join('')}</div>${button('ログアウト','logout','alt')}</section>`;return}if(!g){app.textContent='読み込み中…';return}const current=members.filter(m=>m.epoch===g.epoch),approved=current.filter(m=>m.approved),pending=current.filter(m=>!m.approved),q=questions.filter(x=>x.open&&x.epoch===g.epoch&&x.session===g.session&&approved.some(m=>m.id===x.id)),a=answers.filter(x=>g.active&&x.session===g.session&&x.epoch===g.epoch&&x.problem===g.problem&&x.phase===g.phase&&approved.some(m=>m.id===x.id));app.innerHTML=`<section class="compact">${button('← 集団一覧へ戻る','back','backbtn')}<h2>${esc(g.name)}</h2><p>登録済み ${approved.length}人 / 承認待ち ${pending.length}人</p></section>${pendingPanel(pending)}<section>${g.active?`<div class="lessonheading">${esc(g.lessonTitle||'タイトル未設定')} ${button('授業タイトル変更','lessontitle','editmini seatgreen')}</div>`:''}<div class="problemline">${heading(g.active?'授業中・'+esc(problemName()):'授業開始前',g.active?'CLASS IN PROGRESS':'READY FOR CLASS','⚡')}${g.active?button('✎ 問題名を変更','problemrename','editmini seatblue'):''}</div>${g.active?`<div class="phasegrid">${phases.map((p,i)=>`<button aria-label="${esc(plain(p))}" aria-pressed="${g.phase===i}" data-act="phase:${i}" class="phasebtn ${g.phase===i?'selected':''}" ${i===3&&g.postDone?'disabled':''}><img src="${phaseImages[i]}" alt="${esc(plain(p))}"></button>`).join('')}</div><div class="progressbuttons">${button('<span>NEXT CHALLENGE</span>'+stamp(7)+'<b>次の問題へ！ →</b>','next','nextbig')}${button('<span>FINISH LESSON</span>'+stamp(8)+'<b>授業終了！</b>','end','endbig')}</div>`:button(stamp(7)+'<div><small>LET’S START!</small><b>授業スタート！</b><span>今日も楽しく授業しよう！</span></div>','start','startbig')}<div class="seatlayout"><div>${heading("リアルタイム座席表","CLASSROOM MAP","▦","gold")}${seatPanel(approved,a,q)}</div><div class="summary">${heading("リアルタイム集計","LIVE REACTION","▥","green")}<small>回答状況</small><div class="metric">${a.length} / ${approved.length}人</div><div class="bar"><i style="width:${approved.length?a.length/approved.length*100:0}%;background:#245cc2"></i></div>${(opts[g.phase]||[]).map((x,i)=>{const n=a.filter(v=>v.answer===i).length;return `<div class="summaryrow">${sticker(g.phase,i)}<div>${esc(plain(x))}<div class="bar"><i style="width:${approved.length?n/approved.length*100:0}%;background:${['#16865b','#367bce','#d69a20','#dc414d'][g.phase===3?[0,2,3][i]:i]}"></i></div></div><b>${n}<small>人</small></b></div>`}).join('')}${actionPanel('質問待ち',9,[...q].sort((x,y)=>(x.requestedAt||'').localeCompare(y.requestedAt||'')).map(v=>approved.find(m=>m.id===v.id)),'ask')}${actionPanel('教えられる',7,a.filter(v=>v.help).map(v=>approved.find(m=>m.id===v.id)),'help')}</div></div></section><section>${heading("授業記録・データ管理","LESSON RECORDS","▤","purple")}${button("授業履歴を見る","history","seatblue")}${button("回答履歴 CSV出力","csv","seatgreen")}</section>${historyPanel()}<section><div class="rosterhead">${heading("生徒名簿","CLASS MEMBERS","♟","green")}<small>登録済み ${approved.length}人</small>${button(rosterOpen?'▲ 名簿を閉じる':'▼ 名簿を開く','roster','rosterbtn')}</div>${rosterOpen?`<div class="rosterscroll"><table><tr><th>番号・氏名</th><th>状態・操作</th></tr>${approved.sort((a,b)=>a.number.localeCompare(b.number)).map(m=>`<tr><td>${esc(m.number)} ${esc(m.name)}</td><td>${m.approved?esc(opts[g.phase]?.[a.find(v=>v.id===m.id)?.answer]||'未回答'):button('承認','approve:'+m.id)} ${button('編集','edit:'+m.id,'alt')} ${button('解除','kick:'+m.id,'danger')}</td></tr>`).join('')}</table></div>`:''}</section>`;return}
if(!gid){app.innerHTML=`<section>先生から配布された参加URLを開いてください。${button('ログアウト','logout','alt')}</section>`;return}if(!mine){app.innerHTML=`<section><h2>初回登録</h2><input id="number" inputmode="numeric" maxlength="4" placeholder="1103"><input id="name" maxlength="60" placeholder="氏名">${button('登録申請','register')}<p><small>11HR 3番 → 1103</small></p></section>`;return}if(!mine.approved){app.innerHTML=`<section><h2>承認待ち</h2>${esc(mine.number)} ${esc(mine.name)}<p>先生に承認してもらってください。</p></section>`;return}if(!g||mine.epoch!==g.epoch||!g.enabled){app.innerHTML='<section>登録が無効になりました。先生から新しい参加URLを受け取ってください。</section>';return}const open=myq?.open&&myq.session===g.session&&myq.epoch===g.epoch;app.innerHTML=`<section><small>${esc(g.name)} / ${esc(mine.number)} ${esc(mine.name)}</small><div class="lessonheading">${g.active?esc(g.lessonTitle||''):''}</div><div class="studentphase"><img src="${phaseImages[g.active?g.phase:0]}" alt="${esc(plain(phases[g.active?g.phase:0]))}"></div>${g.active?`<h3>${esc(problemName())}</h3><div class="grid">${(opts[g.phase]||[]).map((x,i)=>button(sticker(g.phase,i)+'<span>'+esc(plain(x))+'</span>','answer:'+i,'reaction '+(mya?.answer===i?'selected':''))).join('')}</div>${g.phase===1&&mya?.answer===0?`<div class="helpmission appear"><h2>${mya.help?'ありがとう！！':'さすがです！次は君の力を貸してくれ！'}</h2><p>${mya.help?'君の力が、友達の「わかった！」につながるよ。':'君の「わかった！」を、友達にも届けてみない？'}</p><button class="helpbig ${mya.help?'on':''}" data-act="help">${stamp(mya.help?8:7)}<span>${mya.help?'教えられる状態を解除する':'友達に教えられるよ！'}</span></button></div>`:''}${open?`<div class="askbanner appear"><img src="${askBanner}" alt="先生が向かいます。待っててね！"></div>${button(stamp(8)+'<span>解決しました！</span>','question','helpbig appear')}`:button(stamp(9)+'<span>質問したい！</span>','question','questionbig')}`:''}</section>`}
function poll(){if(watchPoll===g?.poll)return;pollStop?.();pollStop=null;watchPoll=g?.poll||'';answers=[];mya=null;if(watchPoll){pollStop=teacher()?listen(col('polls',watchPoll,'answers'),s=>{answers=rows(s);render()}):listen(ref('polls',watchPoll,'answers',user.uid),s=>{mya=data(s);render()})}}
function openGroup(k){clear();gid=k;if(teacher()){stops.push(listen(ref('polls','__seating'),s=>{seatConfig=data(s)?.seating||null;render()}),listen(ref(),s=>{g=data(s);poll();render()}),listen(col('members'),s=>{members=rows(s);render()}),listen(col('questions'),s=>{questions=rows(s);render()}))}else{stops.push(listen(ref('members',user.uid),s=>{mine=data(s);if(mine?.approved&&!groupStop){groupStop=listen(ref(),s=>{g=data(s);poll();render()});stops.push(listen(ref('questions',user.uid),s=>{myq=data(s);render()}))}if(!mine?.approved){groupStop?.();groupStop=null;pollStop?.();pollStop=null;watchPoll='';g=null}render()}))}render()}
function home(){clear();gid='';stops.push(listen(collection(db,'groups'),s=>{groups=rows(s);render()}));render()}
onAuthStateChanged(auth,u=>{clear();user=u;gid='';if(teacher())home();else if(u&&join)openGroup(join);else if(u&&localStorage.getItem('reactionGroup'))openGroup(localStorage.getItem('reactionGroup'));else render()});
async function phase(p){if(p===g.phase||p===3&&g.postDone)return;const patch={phase:p,poll:'',postDone:g.postDone||p===3};const b=writeBatch(db);if(p===1||p===3){patch.poll=id();b.set(ref('polls',patch.poll),{session:g.session,problem:g.problem,problemName:problemName(),lessonTitle:g.lessonTitle||'',phase:p,epoch:g.epoch,date:new Date().toISOString()})}b.update(ref(),patch);await b.commit()}
const val=x=>document.getElementById(x)?.value.trim();async function act(a){const [cmd,k]=a.split(':');switch(cmd){case'listlink':case'listrename':case'listreset':case'listremove':{const r=doc(db,'groups',k), x=(await getDoc(r)).data();if(!x?.enabled)break;if(cmd==='listlink'){const url=new URL(location.href);url.search='';url.searchParams.set('join',k);url.searchParams.set('epoch',x.epoch);try{await navigator.clipboard.writeText(url.href);alert('参加URLをコピーしました')}catch{prompt('参加URL',url.href)}}else if(cmd==='listrename'){const n=prompt('集団名',x.name);if(n?.trim())await updateDoc(r,{name:n.trim()})}else{if(x.active){alert('授業終了後に操作してください');break}if(!confirm('旧登録を無効化します。過去の回答履歴は残ります。よろしいですか？'))break;const epoch=id();await updateDoc(r,{epoch,active:false,poll:'',phase:0,enabled:cmd==='listreset'});for(const m of (await getDocs(collection(r,'members'))).docs)if(m.data().epoch!==epoch)await deleteDoc(m.ref)}break}case'roster':rosterOpen=!rosterOpen;render();break;case'lessontitle':case'histtitle':{const session=cmd==='histtitle'?historySession:g.session;const old=cmd==='histtitle'?historyData.find(p=>p.session===session)?.lessonTitle:g.lessonTitle;const n=prompt('授業タイトル',old||'');if(n===null)break;const title=n.trim().slice(0,100);const docs=(await getDocs(col('polls'))).docs.filter(p=>p.data().session===session);const updates=docs.map(p=>p.ref);if(g.session===session)updates.push(ref());for(let i=0;i<updates.length;i+=450){const b=writeBatch(db);for(const d of updates.slice(i,i+450))b.update(d,{lessonTitle:title});await b.commit()}historyData=historyData.map(p=>p.session===session?{...p,lessonTitle:title}:p);render();break}case'seatmode':editingSeats=!editingSeats;picked=-1;render();break;case'seatflip':reverseSeats=!reverseSeats;render();break;case'seat':{const st=seatState(members.filter(m=>m.approved&&m.epoch===g.epoch)),i=Number(k);if(!editingSeats){const m=members.find(m=>m.id===st.slots[i]);if(m){const v=answers.find(a=>a.id===m.id);alert(m.number+' '+m.name+'\n'+(opts[g.phase]?.[v?.answer]||'未回答'))}break}if(picked<0){picked=i;render();break}if(picked<st.slots.length){[st.slots[picked],st.slots[i]]=[st.slots[i],st.slots[picked]];picked=-1;await setDoc(ref('polls','__seating'),{seating:st})}break}case'seatcol':case'seatrow':case'seatauto':{const approved=members.filter(m=>m.approved&&m.epoch===g.epoch),st=seatState(approved);if(cmd==='seatcol')st.columns=Math.max(2,Math.min(10,st.columns+Number(k)));if(cmd==='seatrow')st.rows=Math.max(1,Math.min(15,st.rows+Number(k)));if(cmd==='seatauto')st.slots=[...approved].sort((a,b)=>a.number.localeCompare(b.number)).map(m=>m.id);while(st.slots.length&&st.slots.at(-1)==='')st.slots.pop();st.rows=Math.max(st.rows,Math.ceil(st.slots.length/st.columns));while(st.slots.length<st.rows*st.columns)st.slots.push('');picked=-1;await setDoc(ref('polls','__seating'),{seating:st});break}case'history':{historyData=[];for(const p of (await getDocs(col('polls'))).docs){if(p.id==='__seating')continue;historyData.push({...p.data(),answers:rows(await getDocs(collection(p.ref,'answers')))})}historyData.sort((a,b)=>b.date.localeCompare(a.date));historySession=historyData[0]?.session||'';historyOpen=true;render();break}case'historyclose':historyOpen=false;render();break;case'histselect':historySession=[...new Set(historyData.map(p=>p.session))][Number(k)];render();break;case'login' :await signInWithEmailAndPassword(auth,val('email'),document.getElementById('pw').value);break;case'anon':await signInAnonymously(auth);break;case'logout':await signOut(auth);break;case'create':if(!val('newname'))return;await setDoc(doc(db,'groups',id()),{name:val('newname'),enabled:true,epoch:id(),active:false,phase:0,poll:'',session:'',problem:1,postDone:false});break;case'open':openGroup(k);break;case'back':home();break;case'link':{const url=new URL(location.href);url.search='';url.searchParams.set('join',gid);url.searchParams.set('epoch',g.epoch);try{await navigator.clipboard.writeText(url.href);alert('参加URLをコピーしました')}catch{prompt('参加URL',url.href)}break}case'rename':{const n=prompt('集団名',g.name);if(n?.trim())await updateDoc(ref(),{name:n.trim()});break}case'reset':case'remove':if(confirm('旧登録を無効化します。過去の回答履歴は残ります。よろしいですか？')){await updateDoc(ref(),{epoch:id(),active:false,poll:'',phase:0,enabled:cmd==='reset'});const old=await getDocs(col('members'));for(const m of old.docs)if(m.data().epoch!== (await getDoc(ref())).data().epoch)await deleteDoc(m.ref);if(cmd==='remove')home()}break;case'problemrename':{const n=prompt('問題名（例：教科書 p.42 問3）',problemName());if(n===null||!n.trim())break;const name=n.trim().slice(0,100);const b=writeBatch(db);b.update(ref(),{problemName:name});for(const p of (await getDocs(col('polls'))).docs){const v=p.data();if(v.session===g.session&&v.problem===g.problem)b.update(p.ref,{problemName:name})}await b.commit();break}case'start':{const n=prompt('今日の授業タイトル（空欄でも開始できます）','');if(n===null)break;await updateDoc(ref(),{lessonTitle:n.trim().slice(0,100),active:true,session:id(),problem:1,problemName:'問題 1',phase:0,poll:'',postDone:false});break}case'end':{const d=document.querySelector('#endDialog');d.returnValue='cancel';if(!await new Promise(resolve=>{d.addEventListener('close',()=>resolve(d.returnValue==='end'),{once:true});d.showModal()}))break;} await updateDoc(ref(),{active:false,phase:0,poll:''});alert('お疲れさまでした！');break;case'next':await updateDoc(ref(),{problem:g.problem+1,problemName:'問題 '+(g.problem+1),phase:0,poll:'',postDone:false});break;case'phase':await phase(Number(k));break;case'approveall':{const current=members.filter(m=>m.epoch===g.epoch), used=new Set(current.filter(m=>m.approved).map(m=>m.number)), skipped=[];const b=writeBatch(db);for(const m of current.filter(m=>!m.approved)){if(used.has(m.number)){skipped.push(m.number);continue}used.add(m.number);b.update(ref('members',m.id),{approved:true})}await b.commit();if(skipped.length)alert('番号重複のため未承認：'+skipped.join('、'));break}case'approve':{const m=members.find(x=>x.id===k);if(members.some(x=>x.id!==k&&x.approved&&x.epoch===g.epoch&&x.number===m.number))throw Error('同じ番号が登録済みです');await updateDoc(ref('members',k),{approved:true});break}case'edit':{const m=members.find(x=>x.id===k),n=prompt('４桁番号',m.number),name=prompt('氏名',m.name);if(!n||!name)return;if(!/^[1-9][0-9](0[1-9]|[1-9][0-9])$/.test(n)||members.some(x=>x.id!==k&&x.epoch===g.epoch&&x.number===n))throw Error('番号が不正または重複しています');await updateDoc(ref('members',k),{number:n,name:name.trim()});break}case'kick':if(confirm('登録を解除しますか？'))await deleteDoc(ref('members',k));break;case'register':{const n=val('number'),name=val('name');if(!/^[1-9][0-9](0[1-9]|[1-9][0-9])$/.test(n)||!name)throw Error('４桁番号と氏名を入力してください');const epoch=params.get('epoch');if(!epoch)throw Error('新しい参加URLが必要です');await setDoc(ref('members',user.uid),{number:n,name,approved:false,epoch});localStorage.setItem('reactionGroup',gid);break}case'answer':case'help':if(cmd==='help'&&mya?.answer!==0)return;await setDoc(ref('polls',g.poll,'answers',user.uid),{answer:cmd==='answer'?Number(k):mya.answer,help:cmd==='help'?!mya.help:Number(k)===0&&mya?.answer===0?!!mya.help:false,epoch:g.epoch,session:g.session,problem:g.problem,phase:g.phase});break;case'question':await setDoc(ref('questions',user.uid),{open:!(myq?.open&&myq.session===g.session&&myq.epoch===g.epoch),epoch:g.epoch,session:g.session,requestedAt:new Date().toISOString()});break;case'csv':{const out=[['日時','授業ID','授業タイトル','問題','問題名','段階','内部ID','回答','教えられる']];for(const p of (await getDocs(col('polls'))).docs){if(p.id==='__seating')continue;for(const a of (await getDocs(collection(p.ref,'answers'))).docs){const v=a.data();out.push([p.data().date,v.session,p.data().lessonTitle||'',v.problem,p.data().problemName||'問題 '+v.problem,phases[v.phase],a.id,opts[v.phase]?.[v.answer],v.help?'はい':'いいえ'])}}const csv=out.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='reactions.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}}}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||busy)return;busy=true;err.textContent='';try{await act(b.dataset.act)}catch(e){fail(e)}finally{busy=false}});
