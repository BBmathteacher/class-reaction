<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Reaction</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#18253b;font:16px system-ui,sans-serif}header{background:#172c4c;color:white;padding:20px}main{max-width:1000px;margin:auto;padding:18px}section{background:white;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 3px 15px #18304a12}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #b9c6d8;margin:4px}button{background:#245cc2;color:white;border:0;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.alt{background:#e4eaf4;color:#18304a}button.danger{background:#b33142}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.reaction{min-height:100px;font-size:20px}.selected{outline:4px solid #102b55;outline-offset:2px}small{color:#58677c}#error{color:#a32435;white-space:pre-wrap}input{max-width:100%}h2,h3{margin-top:0}a{color:#245cc2}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;overflow-wrap:anywhere}</style><header><b>⚡ CLASS REACTION</b>　授業を、もっと双方向に。</header><main><div id="error" role="alert"></div><div id="app">接続中…</div></main><script type="module">

const db=getFirestore(initializeApp(config)),auth=getAuth(),T='CqGczldDxmbzQ8ztmjjUXgKxtoX2',app=document.querySelector('#app'),err=document.querySelector('#error');
const phases=['☕ 待機中','✏️ 問題演習中','👨‍🏫 解説中','📊 解説終了後'],opts={1:['😎 解けた！（ドヤ！）','🤝 解けた（友達に教えてもらったよ）','🤔 ちょっと自信ない','😵 マジ無理解説求む！'],3:['💡 なるほど！','🤔 何となくわかったかな？','✋ ちょっと待って、もう一回！']};
let user,gid='',g=null,members=[],questions=[],answers=[],mine=null,myq=null,mya=null,stops=[],pollStop=null,groupStop=null,watchPoll='',groups=[],busy=false;const params=new URLSearchParams(location.search),join=params.get('join');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ref=(...p)=>doc(db,'groups',gid,...p),col=(...p)=>collection(db,'groups',gid,...p),teacher=()=>user?.uid===T;const id=()=>crypto.randomUUID();
function fail(e){err.textContent=e.message||String(e)}function clear(){stops.forEach(f=>f());stops=[];pollStop?.();groupStop?.();pollStop=groupStop=null;watchPoll='';g=null;members=[];questions=[];answers=[];mine=myq=mya=null}function listen(r,f){return onSnapshot(r,f,fail)}function data(s){return s.exists()?s.data():null}function rows(s){return s.docs.map(d=>({id:d.id,...d.data()}))}function button(t,a,c=''){return `<button class="${c}" data-act="${a}">${t}</button>`}function render(){if(!user){app.innerHTML=`<section><h2>${join?'生徒用':'教員ログイン'}</h2>${join?button('生徒として参加','anon'):`<input id="email" type="email" placeholder="メールアドレス"><input id="pw" type="password" placeholder="パスワード">${button('ログイン','login')}`}</section>`;return}if(teacher()){if(!gid){app.innerHTML=`<section><h2>担当授業集団</h2><input id="newname" placeholder="新しい集団名">${button('集団作成','create')}<div class="grid">${groups.filter(x=>x.enabled).map(x=>`<section><h3>${esc(x.name)}</h3>${button('開く','open:'+x.id)}</section>`).join('')}</div>${button('ログアウト','logout','alt')}</section>`;return}if(!g){app.textContent='読み込み中…';return}const current=members.filter(m=>m.epoch===g.epoch),approved=current.filter(m=>m.approved),pending=current.filter(m=>!m.approved),q=questions.filter(x=>x.open&&x.epoch===g.epoch&&x.session===g.session&&approved.some(m=>m.id===x.id)),a=answers.filter(x=>approved.some(m=>m.id===x.id));app.innerHTML=`<section>${button('集団一覧','back','alt')}<h2>${esc(g.name)}</h2>${button('参加URLをコピー','link')}${button('集団名変更','rename','alt')}${button('生徒一括リセット','reset','danger')}${button('集団削除','remove','danger')}<p>登録済み ${approved.length}人 / 承認待ち ${pending.length}人</p></section><section><h2>${g.active?'授業中・問題 '+g.problem:'授業開始前'}</h2>${g.active?`<div class="grid">${phases.map((p,i)=>`<button data-act="phase:${i}" class="${g.phase===i?'selected':''}" ${i===3&&g.postDone?'disabled':''}>${p}</button>`).join('')}</div>${button('次の問題','next')}${button('授業終了','end','danger')}`:button('授業開始','start')}<p>回答 ${a.length} / ${approved.length}人</p>${(opts[g.phase]||[]).map((x,i)=>`<p>${x}　<b>${a.filter(v=>v.answer===i).length}人</b></p>`).join('')}<p>教えられる：${a.filter(v=>v.help).map(v=>esc(approved.find(m=>m.id===v.id)?.number)).join('、')||'なし'}</p><h3>🙋 質問待ち ${q.length}人</h3>${q.map(v=>{const m=approved.find(m=>m.id===v.id);return `<p><b>${esc(m.number)} ${esc(m.name)}</b></p>`}).join('')}</section><section><h2>生徒名簿</h2><table><tr><th>番号・氏名</th><th>状態・操作</th></tr>${current.sort((a,b)=>a.number.localeCompare(b.number)).map(m=>`<tr><td>${esc(m.number)} ${esc(m.name)}</td><td>${m.approved?esc(opts[g.phase]?.[a.find(v=>v.id===m.id)?.answer]||'未回答'):button('承認','approve:'+m.id)} ${button('編集','edit:'+m.id,'alt')} ${button('解除','kick:'+m.id,'danger')}</td></tr>`).join('')}</table>${button('回答履歴 CSV','csv','alt')}</section>`;return}
if(!gid){app.innerHTML=`<section>先生から配布された参加URLを開いてください。${button('ログアウト','logout','alt')}</section>`;return}if(!mine){app.innerHTML=`<section><h2>初回登録</h2><input id="number" inputmode="numeric" maxlength="4" placeholder="1103"><input id="name" maxlength="60" placeholder="氏名">${button('登録申請','register')}<p><small>11HR 3番 → 1103</small></p></section>`;return}if(!mine.approved){app.innerHTML=`<section><h2>承認待ち</h2>${esc(mine.number)} ${esc(mine.name)}<p>先生に承認してもらってください。</p></section>`;return}if(!g||mine.epoch!==g.epoch||!g.enabled){app.innerHTML='<section>登録が無効になりました。先生から新しい参加URLを受け取ってください。</section>';return}const open=myq?.open&&myq.session===g.session&&myq.epoch===g.epoch;app.innerHTML=`<section><small>${esc(g.name)} / ${esc(mine.number)} ${esc(mine.name)}</small><h2>${g.active?phases[g.phase]:'☕ 授業開始をお待ちください'}</h2>${g.active?`<p>問題 ${g.problem}</p><div class="grid">${(opts[g.phase]||[]).map((x,i)=>button(x,'answer:'+i,'reaction '+(mya?.answer===i?'selected':''))).join('')}</div>${g.phase===1&&mya?.answer===0?button(mya.help?'✓ 教えられるよ！ 登録済み':'🤝 友達に教えられるよ！','help','alt'):''}<p>${button(open?'✓ 解決しました！':'🙋 質問したい！','question')}</p>`:''}</section>`}
function poll(){if(watchPoll===g?.poll)return;pollStop?.();pollStop=null;watchPoll=g?.poll||'';answers=[];mya=null;if(watchPoll){pollStop=teacher()?listen(col('polls',watchPoll,'answers'),s=>{answers=rows(s);render()}):listen(ref('polls',watchPoll,'answers',user.uid),s=>{mya=data(s);render()})}}
function openGroup(k){clear();gid=k;if(teacher()){stops.push(listen(ref(),s=>{g=data(s);poll();render()}),listen(col('members'),s=>{members=rows(s);render()}),listen(col('questions'),s=>{questions=rows(s);render()}))}else{stops.push(listen(ref('members',user.uid),s=>{mine=data(s);if(mine?.approved&&!groupStop){groupStop=listen(ref(),s=>{g=data(s);poll();render()});stops.push(listen(ref('questions',user.uid),s=>{myq=data(s);render()}))}if(!mine?.approved){groupStop?.();groupStop=null;pollStop?.();pollStop=null;watchPoll='';g=null}render()}))}render()}
function home(){clear();gid='';stops.push(listen(collection(db,'groups'),s=>{groups=rows(s);render()}));render()}
onAuthStateChanged(auth,u=>{clear();user=u;gid='';if(teacher())home();else if(u&&join)openGroup(join);else if(u&&localStorage.getItem('reactionGroup'))openGroup(localStorage.getItem('reactionGroup'));else render()});
async function phase(p){if(p===g.phase||p===3&&g.postDone)return;const patch={phase:p,poll:'',postDone:g.postDone||p===3};const b=writeBatch(db);if(p===1||p===3){patch.poll=id();b.set(ref('polls',patch.poll),{session:g.session,problem:g.problem,phase:p,epoch:g.epoch,date:new Date().toISOString()})}b.update(ref(),patch);await b.commit()}
const val=x=>document.getElementById(x)?.value.trim();async function act(a){const [cmd,k]=a.split(':');switch(cmd){case'login':await signInWithEmailAndPassword(auth,val('email'),document.getElementById('pw').value);break;case'anon':await signInAnonymously(auth);break;case'logout':await signOut(auth);break;case'create':if(!val('newname'))return;await setDoc(doc(db,'groups',id()),{name:val('newname'),enabled:true,epoch:id(),active:false,phase:0,poll:'',session:'',problem:1,postDone:false});break;case'open':openGroup(k);break;case'back':home();break;case'link':{const url=new URL(location.href);url.search='';url.searchParams.set('join',gid);url.searchParams.set('epoch',g.epoch);try{await navigator.clipboard.writeText(url.href);alert('参加URLをコピーしました')}catch{prompt('参加URL',url.href)}break}case'rename':{const n=prompt('集団名',g.name);if(n?.trim())await updateDoc(ref(),{name:n.trim()});break}case'reset':case'remove':if(confirm('旧登録を無効化します。過去の回答履歴は残ります。よろしいですか？')){await updateDoc(ref(),{epoch:id(),active:false,poll:'',phase:0,enabled:cmd==='reset'});const old=await getDocs(col('members'));for(const m of old.docs)if(m.data().epoch!== (await getDoc(ref())).data().epoch)await deleteDoc(m.ref);if(cmd==='remove')home()}break;case'start':await updateDoc(ref(),{active:true,session:id(),problem:1,phase:0,poll:'',postDone:false});break;case'end':await updateDoc(ref(),{active:false,phase:0,poll:''});break;case'next':await updateDoc(ref(),{problem:g.problem+1,phase:0,poll:'',postDone:false});break;case'phase':await phase(Number(k));break;case'approve':{const m=members.find(x=>x.id===k);if(members.some(x=>x.id!==k&&x.approved&&x.epoch===g.epoch&&x.number===m.number))throw Error('同じ番号が登録済みです');await updateDoc(ref('members',k),{approved:true});break}case'edit':{const m=members.find(x=>x.id===k),n=prompt('４桁番号',m.number),name=prompt('氏名',m.name);if(!n||!name)return;if(!/^[1-9][0-9](0[1-9]|[1-9][0-9])$/.test(n)||members.some(x=>x.id!==k&&x.epoch===g.epoch&&x.number===n))throw Error('番号が不正または重複しています');await updateDoc(ref('members',k),{number:n,name:name.trim()});break}case'kick':if(confirm('登録を解除しますか？'))await deleteDoc(ref('members',k));break;case'register':{const n=val('number'),name=val('name');if(!/^[1-9][0-9](0[1-9]|[1-9][0-9])$/.test(n)||!name)throw Error('４桁番号と氏名を入力してください');const epoch=params.get('epoch');if(!epoch)throw Error('新しい参加URLが必要です');await setDoc(ref('members',user.uid),{number:n,name,approved:false,epoch});localStorage.setItem('reactionGroup',gid);break}case'answer':case'help':await setDoc(ref('polls',g.poll,'answers',user.uid),{answer:cmd==='answer'?Number(k):mya.answer,help:cmd==='help'?!mya.help:false,epoch:g.epoch,session:g.session,problem:g.problem,phase:g.phase});break;case'question':await setDoc(ref('questions',user.uid),{open:!(myq?.open&&myq.session===g.session&&myq.epoch===g.epoch),epoch:g.epoch,session:g.session});break;case'csv':{const out=[['日時','授業ID','問題','段階','内部ID','回答','教えられる']];for(const p of (await getDocs(col('polls'))).docs){for(const a of (await getDocs(collection(p.ref,'answers'))).docs){const v=a.data();out.push([p.data().date,v.session,v.problem,phases[v.phase],a.id,opts[v.phase]?.[v.answer],v.help?'はい':'いいえ'])}}const csv=out.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='reactions.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}}}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||busy)return;busy=true;err.textContent='';try{await act(b.dataset.act)}catch(e){fail(e)}finally{busy=false}});
